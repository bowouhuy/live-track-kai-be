name: live-track-kai-backend

services:
  backend:
    build: .
    image: live-track-kai-backend:latest
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      PORT: "8080"
      DATA_DIR: /data/raw
      BROADCAST_INTERVAL_SECONDS: ${BROADCAST_INTERVAL_SECONDS:-5}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-*}
    volumes:
      - ./data/raw:/data/raw:ro
    ports:
      # Default binds to localhost only: put nginx/Caddy on the host in front.
      # Set BIND_ADDR=0.0.0.0 in .env to expose it directly on the public IP.
      - "${BIND_ADDR:-127.0.0.1}:${HOST_PORT:-8080}:8080"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # One-off tool: download a fresh snapshot from gapeka2025.com into ./data/raw.
  #   docker compose run --rm fetch
  #   docker compose kill -s HUP backend   # reload without restart
  fetch:
    image: live-track-kai-backend:latest
    build: .
    profiles: ["tools"]
    user: root
    entrypoint: ["/app/fetch"]
    environment:
      DATA_DIR: /data/raw
    volumes:
      - ./data/raw:/data/raw
